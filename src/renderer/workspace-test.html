<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Workspace Test Harness - revealGDB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu',
        'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .test-header {
      background: #2d2d2d;
      color: white;
      padding: 16px;
      border-bottom: 2px solid #007acc;
    }

    .test-header h1 {
      margin: 0 0 8px 0;
      font-size: 20px;
    }

    .test-header p {
      margin: 0;
      font-size: 12px;
      color: #ccc;
    }

    .test-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .test-left {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      border-right: 1px solid #ddd;
    }

    .test-right {
      width: 400px;
      padding: 16px;
      overflow-y: auto;
      background: #f5f5f5;
    }

    .test-section {
      margin-bottom: 24px;
    }

    .test-section h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #333;
      border-bottom: 2px solid #007acc;
      padding-bottom: 8px;
    }

    .test-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .test-button {
      padding: 8px 16px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .test-button:hover {
      background: #005a9e;
    }

    .test-button.secondary {
      background: #666;
    }

    .test-button.secondary:hover {
      background: #777;
    }

    .test-output {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 12px;
    }

    .test-log-entry {
      margin: 4px 0;
      padding: 4px 0;
      border-bottom: 1px solid #eee;
    }

    .test-log-entry.info {
      color: #0066cc;
    }

    .test-log-entry.success {
      color: #009900;
    }

    .test-log-entry.error {
      color: #cc0000;
    }

    .test-log-entry.warning {
      color: #ff9900;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="./workspace-test.tsx"></script>
</body>

</html>
