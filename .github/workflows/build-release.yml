name: Build & Release

# ─── Triggers ──────────────────────────────────────────────────────────────────
# Scheduled: every Friday ~8 PM PDT (Sat 03:00 UTC).
#   Note: GitHub cron is UTC-only. This is 8 PM PDT (summer) / 7 PM PST (winter).
# On-demand: workflow_dispatch with optional branch override.
on:
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: false
        default: "main"
        type: string

# Allow the workflow to push commits and create releases
permissions:
  contents: write

# ─── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  # ── 1. Increment patch version, tag the repo, and push back to branch ─────────
  bump-version:
    name: Bump Patch Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Compute version (patch bump + short SHA of source code HEAD)
        id: compute-version
        run: |
          # Capture SHA of source code before the version-bump commit
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Bump patch number only (no git tag, no commit yet)
          npm version patch --no-git-tag-version
          # Read the bumped 3-part semver
          BASE_VERSION=$(node -e "console.log(require('./package.json').version)")
          # Build the 4-part version: major.minor.patch.sha
          FULL_VERSION="${BASE_VERSION}.${SHORT_SHA}"
          # Write the 4-part version back to package.json
          npm pkg set version="${FULL_VERSION}"
          echo "version=${FULL_VERSION}" >> $GITHUB_OUTPUT

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.compute-version.outputs.version }} [skip ci]"
          git push origin HEAD:${{ github.event.inputs.branch || 'main' }}

      - name: Create and push version tag
        run: |
          git tag "v${{ steps.compute-version.outputs.version }}"
          git push origin "v${{ steps.compute-version.outputs.version }}"

  # ── 2. Linux (AppImage x64 + ARM64) ─────────────────────────────────────────
  build-linux:
    name: Build Linux (x64 + ARM64)
    runs-on: ubuntu-latest
    needs: bump-version

    steps:
      - name: Checkout (post version-bump HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      # QEMU enables running/linking ARM64 binaries on the x64 host
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging dependencies
        run: sudo apt-get install -y rpm

      - name: Build (release mode)
        run: npm run vite-build:release
        env:
          REVEALGDB_BUILD: release
          REVEALGDB_DEBUG: "false"

      - name: Package — Linux x64 + ARM64
        run: npx electron-builder --linux --x64 --arm64 --publish never
        env:
          REVEALGDB_BUILD: release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: dist_electron/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # ── 3. Windows (NSIS installer x64 + ARM64) ──────────────────────────────────
  build-windows:
    name: Build Windows (x64 + ARM64)
    runs-on: windows-latest
    needs: bump-version

    steps:
      - name: Checkout (post version-bump HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (release mode)
        run: npm run vite-build:release
        env:
          REVEALGDB_BUILD: release
          REVEALGDB_DEBUG: "false"

      # electron-builder cross-compiles Windows ARM64 from x64 host natively
      - name: Package — Windows x64 + ARM64
        run: npx electron-builder --win --x64 --arm64 --publish never
        env:
          REVEALGDB_BUILD: release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist_electron/*.exe
          if-no-files-found: error
          retention-days: 7

  # ── 4. macOS (DMG x64 + ARM64) ───────────────────────────────────────────────
  build-mac:
    name: Build macOS (x64 + ARM64)
    runs-on: macos-latest # M1 runner; x64 built via Rosetta 2
    needs: bump-version

    steps:
      - name: Checkout (post version-bump HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (release mode)
        run: npm run vite-build:release
        env:
          REVEALGDB_BUILD: release
          REVEALGDB_DEBUG: "false"

      # identity: null is already set in package.json — this env var is belt-and-suspenders
      - name: Package — macOS x64 + ARM64
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          REVEALGDB_BUILD: release
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: dist_electron/*.dmg
          if-no-files-found: error
          retention-days: 7

  # ── 5. Collect artifacts and create a draft GitHub Release ───────────────────
  create-release:
    name: Create GitHub Draft Release
    runs-on: ubuntu-latest
    needs: [bump-version, build-linux, build-windows, build-mac]

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: release-assets/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: release-assets/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-builds
          path: release-assets/

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump-version.outputs.version }}
          name: revealGDB v${{ needs.bump-version.outputs.version }}
          draft: true
          prerelease: false
          files: release-assets/**
          body: |
            ## revealGDB v${{ needs.bump-version.outputs.version }}

            > This is a **draft release**. Review the attached installers before publishing.

            ### Downloads

            | Platform | Architecture | Installer |
            |----------|-------------|-----------|
            | Linux | x64 | `*-x86_64.AppImage` |
            | Linux | ARM64 | `*-arm64.AppImage` |
            | Windows | x64 | `*-x64 Setup.exe` |
            | Windows | ARM64 | `*-arm64 Setup.exe` |
            | macOS | x64 (Intel) | `*-x64.dmg` |
            | macOS | ARM64 (Apple Silicon) | `*-arm64.dmg` |

            > **Note**: Builds are unsigned. macOS will show a Gatekeeper warning on
            > first launch — right-click → Open to bypass. Windows SmartScreen may
            > also prompt on unknown publishers.
